<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;color:#d5dbd6;
    font-family:"Times New Roman",Georgia,serif;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0;touch-action:none}
  html,body{overscroll-behavior:none;touch-action:none}
  canvas{display:block;width:100%;height:100%;outline:none}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;background:#0a0b0c;z-index:100;transition:opacity 1.2s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #boot h1{font-size:clamp(28px,6vw,64px);letter-spacing:.34em;margin:0;font-weight:400;
    color:#b9c2c0;text-shadow:0 0 40px rgba(120,160,155,.30)}
  #boot .sub{letter-spacing:.5em;font-size:11px;color:#6b6255;text-transform:uppercase}
  #bar{width:min(420px,60vw);height:1px;background:#1a1f1e;position:relative;overflow:hidden}
  #bar i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,#2c4a44,#9fc0b6);
    transition:right .35s ease}
  #boot .task{font-size:11px;letter-spacing:.22em;color:#5c554a;text-transform:uppercase;height:1em}
</style>
</head>
<body>
<div id="app"></div>
<div id="boot">
  <div class="sub">Nothing Left But The</div>
  <h1>BROKEN ROAD</h1>
  <div id="bar"><i id="barfill"></i></div>
  <div class="task" id="boottask">initialising</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
